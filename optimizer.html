<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Image Optimizer | SmartTools</title>
  <link rel="stylesheet" href="css/optimizer.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <h1>Image Optimizer</h1>
    <p>Compress & resize images instantly — no upload required.</p>
  </header>

  <main>
    <div class="optimizer-container">
      <!-- Upload area -->
      <div id="uploadBox" class="upload-box" tabindex="0">
        <input id="fileInput" type="file" accept="image/*" />
        <div class="upload-inner">
          <svg width="48" height="48" viewBox="0 0 24 24" aria-hidden><path fill="currentColor" d="M5 20h14v-2H5v2zm7-18l-5 5h3v6h4V7h3l-5-5z"/></svg>
          <p><strong>Click</strong> or <strong>drag & drop</strong> an image here</p>
          <small>Supported: JPG, PNG, WEBP.</small>
        </div>
      </div>

      <!-- Preview & Controls -->
      <section id="previewSection" class="preview-section hidden">
        <div class="preview-card">
          <img id="previewImage" alt="Preview image" />
        </div>

        <div class="controls">
          <div class="row">
            <label>Width <input id="resizeWidth" type="number" min="1" /></label>
            <label>Height <input id="resizeHeight" type="number" min="1" /></label>
            <label class="keep-ratio">
              <input id="keepRatio" type="checkbox" checked /> keep ratio
            </label>
          </div>

          <div class="row slider">
            <label>Quality: <span id="qualityValue">80</span>%</label>
            <input id="qualityRange" type="range" min="10" max="100" value="80" />
          </div>

          <div class="row actions">
            <button id="optimizeBtn" class="btn primary">Optimize</button>
            <a id="downloadLink" class="btn download hidden" download>Download</a>
            <button id="removeBtn" class="btn danger hidden">Remove</button>
          </div>

          <div id="sizeInfo" class="size-info hidden">
            <div>Original: <strong id="originalSize">—</strong></div>
            <div>Optimized: <strong id="optimizedSize">—</strong></div>
            <div>Saved: <strong id="savedPct">—</strong></div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer>
    <p>© 2025 SmartTools — Designed & Developed by <span>Joy</span></p>
  </footer>

  <script src="js/optimizer.js"></script>
</body>
</html>
