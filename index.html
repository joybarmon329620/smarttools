<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartTools | by Joy</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
  <div class="background"></div>

  <header>
    <div class="header-left">
      <h1 class="gradient-text">SmartTools</h1>
      <p>Everyday tools built beautifully — by Joy.</p>
    </div>
    <button id="theme-toggle" aria-label="Toggle theme">
      <span class="sun">☀️</span>
      <span class="moon">🌙</span>
    </button>
  </header>

  <main class="tools-container">
    <div class="tool-card">
      <img src="assets/icons/image-icon.png" alt="Image Optimizer" />
      <h2>Image Optimizer</h2>
      <p>Compress or resize your images quickly and easily.</p>
      <div class="overlay">
        <a href="optimizer.html" class="open-btn">Open Tool</a>
      </div>
    </div>

    <div class="tool-card">
      <img src="assets/icons/converter-icon.png" alt="Converter" />
      <h2>Unit & Currency Converter</h2>
      <p>Convert units and currencies instantly, no internet needed.</p>
      <div class="overlay">
        <a href="converter.html" class="open-btn">Open Tool</a>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2025 SmartTools — Designed & Developed by <span>Joy</span></p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
